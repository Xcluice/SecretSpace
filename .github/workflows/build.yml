name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed|^> |Could not|FAILED" build.log | head -25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
          fi
          exit $code

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Notes.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Notes-release
          path: dist/Notes.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          files: dist/Notes.apk
          make_latest: true
